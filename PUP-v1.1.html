<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Parameter Uplink Spectagraph v1.1.0</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="ui">
            <h1 style="text-align:center;">LiDAR SLAM Simulation v1.1.0</h1>
            <div class="section">
                <h2>3D Geometry Configuration</h2>
                <div class="btn-group">
                    <button class="btn" id="cfg-2" onclick="switchConfig(2)">Orthogonal</button>
                    <button class="btn active" id="cfg-4" onclick="switchConfig(4)">Tetrahedral</button>
                    <button class="btn" id="cfg-6" onclick="switchConfig(6)">Octahedral</button>
                </div>
            </div>
            <div class="section">
                <h2>Global Control</h2>
                <button class="btn active" id="play-pause" style="width:100%; margin-bottom:10px;" onclick="togglePlay()">⏸ CLICK TO PAUSE</button>
                <div class="btn-group">
                    <button class="btn active" id="toggle-points" onclick="togglePoints()">⦿ POINT CLOUD</button>
                    <button class="btn active" id="toggle-trace" onclick="toggleTrace()">⌇ TRACE PATH</button>
                </div>
                <div class="ctrl-row">
                    <label style="font-size: 9px">Drone speed</label>
                    <input type="range" min="0" max="2.0" step="0.01" value="1.00" oninput="updateSimSpeed(this.value)">
                    <span id="speed-out" class="readout">1.00x</span>
                </div>
                <div class="btn-group" style="margin-top:12px">
                    <button class="btn active" id="cam-iso" onclick="camView('iso')">ISO</button>
                    <button class="btn" id="cam-drone" onclick="camView('drone')">Follow</button>
                    <button class="btn" id="cam-fpv" onclick="camView('fpv')">FPV</button>
                </div>
            </div>
            <div class="section">
                <h2>Drone Wobble (Inertial)</h2>
                <div class="ctrl-row">
                    <label>X-axis</label>
                    <input type="range" min="0" max="1.00" step="0.01" value="0.10" oninput="wobble.x = parseFloat(this.value); document.getElementById('w-x').innerText = parseFloat(this.value).toFixed(2)">
                    <span id="w-x" class="readout">0.10</span>
                </div>
                <div class="ctrl-row">
                    <label>Y-axis</label>
                    <input type="range" min="0" max="1.00" step="0.01" value="0.10" oninput="wobble.y = parseFloat(this.value); document.getElementById('w-y').innerText = parseFloat(this.value).toFixed(2)">
                    <span id="w-y" class="readout">0.10</span>
                </div>
                <div class="ctrl-row">
                    <label>Z-axis</label>
                    <input type="range" min="0" max="1.00" step="0.01" value="0.05" oninput="wobble.z = parseFloat(this.value); document.getElementById('w-z').innerText = parseFloat(this.value).toFixed(2)">
                    <span id="w-z" class="readout">0.05</span>
                </div>
            </div>
            <div class="section">
                <h2>LiDAR Configuration</h2>
                <div id="module-list"></div>
            </div>
            <div class="section">
                <h2>Spatial Analytics</h2>
                <div class="stat-box">
                    <div class="stat">Distance: <span id="st-dist">0.00m</span></div>
                    <div class="stat">Map coverage: <span id="st-pct">0.0%</span></div>
                    <div class="stat">Blind spots: <span id="st-blind" class="alert">100.0%</span></div>
                    <div class="stat">Max hits: <span id="st-heat">0</span></div>
                </div>
                <button class="btn" style="width:100%; margin-top:10px; border-color:#ff3366; color:#ff3366" onclick="resetSession()">Purge Map</button>
                <button class="btn" style="width:100%; margin-top:10px; border-color:#ff3366; color:#ff3366" onclick="factoryReset()">Reset Everything</button>
            </div>
        </div>
        <canvas id="canvas"></canvas>
        <script src="script.js"></script>
    </body>
</html>
